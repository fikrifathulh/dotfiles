"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 1000000

format = """
[](color_8)\
$os\
$username\
[](bg:color_1 fg:color_8)\
$directory\
[](bg:color_5 fg:color_1)\
$git_branch\
$git_status\
[](bg:color_2 fg:color_5)\
$c\
$zig\
$cpp\
$golang\
$rust\
$swift\
$julia\
$erlang\
$ocaml\
$nodejs\
$bun\
$python\
$java\
$gradle\
$maven\
$kotlin\
$haskell\
$lua\
$nix_shell\
$crystal\
$dart\
$ruby\
$scala\
$php\
$rlang\
$terraform\
[](bg:color_6 fg:color_2)\
$docker_context\
$kubernetes_context\
[](bg:color_8 fg:color_6)\
$time\
[](fg:color_8)\
$line_break$character"""

palette = 'hyper_terminal_palette'

[palettes.hyper_terminal_palette]
color_0 = '#000000' # Black
color_1 = '#c51e14' # Red
color_2 = '#98971a' # Green
color_3 = '#d79921' # Yellow
color_4 = '#458588' # Blue
color_5 = '#b16286' # Purple
color_6 = '#689d6a' # Aqua/Cyan
color_7 = '#a88984' # Light Gray
color_8 = '#928374' # Gray
color_9 = '#fb4934' # Bright Red
color_10 = '#b8bb26' # Bright Green
color_11 = '#fabd2f' # Bright Yellow
color_12 = '#83a598' # Bright Blue
color_13 = '#d3869b' # Bright Purple
color_14 = '#8ec07c' # Bright Aqua/Cyan
color_15 = '#ffffff' # White/Beige

[os]
disabled = false
style = "bg:color_8 fg:color_15"
format = '[$symbol]($style)'

[os.symbols]
Linux = "󰌽 "
Arch = " "
Mint = "󰣭 "
FreeBSD = " "
NixOS = " "
Kali = " "
Artix = "󰣇 "
Pop = " "
Fedora = "󰣛 "
Debian = "󰣚 "
SUSE = " "
CachyOS = " "
Ubuntu = "󰕈 "
Manjaro = " "
EndeavourOS = " "
Garuda = " "
Elementary = " "
Zorin = " "
Alpine = " "
CentOS = " "
Macos = "󰀵 "
Android = " "
Windows = "󰍲 "
OpenBSD = " "
Raspbian = " "
Gentoo = "󰣨 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "

[username]
show_always = true
style_user = "bg:color_8 fg:color_15"
style_root = "bg:color_8 fg:color_15"
format = '[$user ]($style)'

[directory]
style = "bg:color_1 fg:color_15"
format = '[  $path ]($style)'
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = "󰝚"
"Pictures" = ""
"GH" = "󰲋" # Change it with your own working directory name

[git_branch]
symbol = ""
style = "bg:color_5 fg:color_15"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:color_5 fg:color_15"
format = '[($all_status$ahead_behind )]($style)'

[c]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[zig]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[cpp]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[golang]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[rust]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[swift]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[julia]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[erlang]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[ocaml]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[nodejs]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[bun]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[python]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[java]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[gradle]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[maven]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[kotlin]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[haskell]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[lua]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[nix_shell]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[crystal]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[dart]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[ruby]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[scala]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[php]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[terraform]
symbol = "  "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[rlang]
symbol = " 󰟔 "
style = "bg:color_2 fg:color_15"
format = '[$symbol$version ]($style)'

[docker_context]
symbol = "  "
style = "bg:color_6 fg:color_15"
format = '[$symbol$context ]($style)'

[kubernetes.contexts]
symbol = " 󱃾 "
style = "bg:color_6 fg:color_15"
format = '[$symbol$context ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_8 fg:color_15"
format = '[  $time  ]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_6)'
error_symbol = '[](bold fg:color_1)'
vimcmd_symbol = '[](bold fg:color_6)'
vimcmd_replace_one_symbol = '[](bold fg:color_5)'
vimcmd_replace_symbol = '[](bold fg:color_5)'
vimcmd_visual_symbol = '[](bold fg:color_7)'
